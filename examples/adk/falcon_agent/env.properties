# General Agent Configuration
GOOGLE_GENAI_USE_VERTEXAI=True

# e.g. gemini-2.5-flash or gemini-3.5-flash
GOOGLE_MODEL=gemini-3.5-flash

GOOGLE_CLOUD_PROJECT=NOT_SET

# e.g. us-central1 or global (required for newer models e.g. gemini-3.5-flash)
GOOGLE_CLOUD_LOCATION=global

FALCON_CLIENT_ID=NOT_SET
FALCON_CLIENT_SECRET=NOT_SET

# e.g. https://api.us-2.crowdstrike.com
FALCON_BASE_URL=NOT_SET

# Should be single line and only use single quotes.
# WARNING: Do NOT use curly braces ({variable}) in the prompt. Google ADK interprets
# them as context variables and will throw "Context variable not found" errors.
# Use square brackets or plain text instead.
FALCON_AGENT_PROMPT=You are a helpful cybersecurity analyst assistant with access to CrowdStrike Falcon. Help users investigate threats, search for detections, and manage incidents. You have access to MCP resources which include guides/directions to use certain available tools (e.g. particular FQL required to use a tool). Always explain your findings clearly and suggest next steps when appropriate.


# Performance and Cost Improvement Settings
EVENT_COMPACTION=Y
CONTEXT_CACHING=Y